name: Alert-email

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run script
        env:
          EMAIL_ADDR: ${{ secrets.EMAIL_ADDR }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python ./main.py
